[package]
name = "mitm-adblock-subscriptions"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
csv = "1"
curl = "0.4"
http = "1"
mitm-adblock-policy = { path = "../policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
tempfile = "3"
tracing = "0.1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
