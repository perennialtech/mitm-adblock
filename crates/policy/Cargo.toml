[package]
name = "mitm-adblock-policy"
version = "0.1.0"
edition = "2024"

[dependencies]
adblock = { version = "=0.13.6", default-features = false, features = ["css-validation", "embedded-domain-resolver", "full-regex-handling"] }
base64 = "0.22"
html-escape = "0.2"
http = "1"
percent-encoding = "2"
regex = "1"
serde_json = "1"
sha2 = "0.11"
