[workspace]
members = ["crates/policy", "crates/subscriptions"]
resolver = "3"

[package]
name = "mitm-adblock"
default-run = "mitm-adblock"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client-legacy"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
openssl = "0.10"
tempfile = "3"
fs2 = "0.4"
regex = "1"
encoding_rs = "0.8"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
brotli-decompressor = { version = "5", default-features = false, features = ["std"] }
zstd = { version = "0.13", default-features = false, features = ["pkg-config"] }
futures-util = { version = "0.3", features = ["sink"] }
http-body = "1"
tower-service = "0.3"
tracing = "0.1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-ring"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
mitm-adblock-policy = { path = "crates/policy" }
mitm-adblock-subscriptions = { path = "crates/subscriptions" }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["net"] }
tun-rs = { version = "2", default-features = false, features = ["async_tokio"] }
netstack-smoltcp = "0.2"
boringtun = { version = "0.7", default-features = false }

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.release]
lto = false
strip = "debuginfo"

[dev-dependencies]
etherparse = "0.16"
