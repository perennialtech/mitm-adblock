[package]
name = "mitm-adblock-engine"
version = "0.1.0"
edition = "2024"

[lib]
name = "mitm_adblock_engine"
crate-type = ["cdylib"]

[dependencies]
adblock = { version = "=0.13.6", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
pyo3 = { version = "=0.30.1", features = ["abi3-py310"] }
serde_json = "1"
